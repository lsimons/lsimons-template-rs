name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same branch/PR; never cancel main, so
# the main-branch record of CI stays complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint-and-test:
    name: Lint, build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Lint (fmt + clippy + actionlint)
        run: mise run lint

      - name: Build
        run: mise run build

      - name: Test
        run: mise run test

      - name: Doc build
        run: mise run doc

  zizmor:
    name: Zizmor (GitHub Actions audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit GitHub Actions workflows (zizmor)
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          # The action defaults to version "latest". Pin it so a zizmor
          # release cannot turn CI red on its own, and keep it equal to
          # the `zizmor` pin in .mise.toml — bump them together.
          #
          # `collect` is deliberately left at the action's default.
          # zizmor's "default" already collects .github/dependabot.yml;
          # the only thing "all" adds is ignoring .gitignore, which would
          # let a deliberately-gitignored scratch workflow gate CI.
          #
          # This job is close to `mise run audit` but not identical: that
          # task also passes --strict-collection, which turns a schema
          # error in a collected file into a failure rather than a
          # warning. The action exposes no input for it, so the local
          # task is the stricter of the two.
          version: "1.29.0"

  cargo-deny:
    name: Cargo-deny (dependency audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true

      # Its own job rather than a step in lint-and-test: this one fails
      # on a new RustSec advisory against an unchanged tree, so it must
      # be able to go red without implying the code broke. Runs the same
      # `deny` task `mise run audit` does.
      #
      # This job does need the full toolchain that mise-action installs,
      # despite running only one prebuilt binary: cargo-deny shells out
      # to `cargo metadata` to build the crate graph, and without cargo
      # on PATH it fails with "failed to run cargo". Do not try to slim
      # this job down to just the cargo-deny tool.
      - name: Audit dependencies (cargo-deny)
        run: mise run deny
