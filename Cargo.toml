[package]
name = "lsimons-template"
version = "0.1.0"
edition = "2024"
description = "Brief project description"
authors = ["lsimons"]
# An SPDX expression rather than `license-file`: it is machine-readable,
# it is what crates.io indexes, and the LICENSE file is packaged anyway.
license = "Apache-2.0"
readme = "README.md"
# `scripts/init.py` rewrites this along with the crate name, which lands
# on the right URL only if the repo follows the `lsimons-<name>-rs`
# convention. Check it after `mise run init`.
repository = "https://github.com/lsimons/lsimons-template-rs"
# Matches the `rust` pin in .mise.toml; bump them together. This is not a
# tested-back-to MSRV — nothing builds against an older toolchain — it is
# a declaration that this crate is built with the pinned toolchain, so
# cargo reports a clear error rather than a confusing one.
rust-version = "1.97"
# Publishing is blocked so a derived project that has not yet run
# `mise run init` cannot `cargo publish` a crate literally called
# `lsimons-template`. crates.io names are permanent and cannot be
# reclaimed, so the mistake is unrecoverable. Delete this line when you
# actually intend to publish.
publish = false

[lib]
# Library code lives in src/lib.rs. The binary target below depends on it.
name = "lsimons_template"
path = "src/lib.rs"

[[bin]]
name = "lsimons-template"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
# Start strict; relax on a case-by-case basis if a lint fires on correct code.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# `restriction` is not enabled as a group on purpose (contains contradictory lints).

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
