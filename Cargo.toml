[package]
name = "lsimons-template"
version = "0.1.0"
edition = "2024"
description = "Brief project description"
authors = ["lsimons"]
# An SPDX expression rather than `license-file`: it is machine-readable,
# it is what crates.io indexes, and the LICENSE file is packaged anyway.
license = "Apache-2.0"
readme = "README.md"
# `scripts/init.py` rewrites this along with the crate name, which lands
# on the right URL only if the repo follows the `lsimons-<name>-rs`
# convention. Check it after `mise run init`.
repository = "https://github.com/lsimons/lsimons-template-rs"
# There is deliberately no `rust-version`. Under resolver 3 — which
# edition 2024 implies — cargo caps dependency resolution at a rustc
# version either way; the question is only which one. Declared, it caps
# at that literal string, which then goes stale on its own schedule.
# Omitted, it caps at the installed toolchain, which `.mise.toml` pins.
# Verified: with `rust-version = "1.97"` `cargo update` reported
# "Locking 1 package to latest Rust 1.97 compatible version"; without it,
# "latest Rust 1.97.1 compatible version".
#
# Omitting it is therefore the safer default here. The ceiling tracks the
# toolchain pin automatically, so bumping `rust` in `.mise.toml` unlocks
# dependency updates in the same step — with a declared MSRV that is a
# second thing to remember, and forgetting it silently holds dependencies
# back. In a lockfile diff that is indistinguishable from "no update
# available", including for a security fix.
#
# It was also a claim this repo could not back: nothing here builds
# against an older toolchain, so the declared minimum was untested.
#
# The one reason to declare it is publishing a library, where MSRV is a
# real contract for downstream users. Do that together with a CI job that
# builds with exactly that toolchain — declared-and-untested is worse
# than absent, because you take a stale ceiling and get no assurance in
# return. Edition 2024 already enforces a floor of 1.85 and says so
# clearly if someone tries an older compiler.
# Publishing is blocked so a derived project that has not yet run
# `mise run init` cannot `cargo publish` a crate literally called
# `lsimons-template`. crates.io names are permanent and cannot be
# reclaimed, so the mistake is unrecoverable. Delete this line when you
# actually intend to publish.
publish = false

[lib]
# Library code lives in src/lib.rs. The binary target below depends on it.
name = "lsimons_template"
path = "src/lib.rs"

[[bin]]
name = "lsimons-template"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }

[dev-dependencies]
assert_cmd = "=2.2.2"
predicates = "=3.1.4"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
# Start strict; relax on a case-by-case basis if a lint fires on correct code.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# `restriction` is not enabled as a group on purpose (contains contradictory lints).

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
