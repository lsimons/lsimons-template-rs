# mise: https://mise.jdx.dev/
#
# `mise install` installs everything under [tools]; `mise run <task>`
# wraps cargo and the audit tools. Cargo.toml's `rust-version` remains
# the MSRV authority, and is kept in step with the `rust` pin below.

# Every tool is pinned to an exact version, deliberately and without
# exception — including the Rust toolchain. This is a supply-chain rule,
# not a stability one: an upstream compromise must never be
# auto-downloaded. A blanket "pin everything, update mechanically"
# policy is far easier to review than a per-dependency judgement about
# which upstreams are trustworthy enough to float.
#
# Note this is *tools*, not dependencies. The crates in Cargo.toml stay
# on caret ranges because Cargo.lock already pins each one to an exact
# version and checksum, and `--locked` makes every task build from the
# lock. Hard-pinning them in Cargo.toml would only fight dependabot.
#
# The cost is that nothing here is covered by dependabot, so these go
# stale silently. Refresh them deliberately with `mise up`, and read the
# diff. Bump `rust-version` in Cargo.toml along with `rust`.
[tools]
rust = "1.97.1"
# Used by `mise run audit`; must match `version:` in the workflow's
# zizmor job. Bump them together.
zizmor = "1.29.0"
# Used by `mise run lint`. actionlint shells out to shellcheck for the
# `run:` blocks in workflows, and silently skips that half if shellcheck
# is missing, so it is pinned here too rather than left to the host.
actionlint = "1.7.12"
shellcheck = "0.11.0"
# Used by `mise run audit` and by the `cargo-deny` CI job: checks
# Cargo.lock against the RustSec advisory database and enforces the
# source policy in deny.toml. Not in mise's registry under a short name,
# hence the explicit aqua backend.
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"

[env]
CARGO_TERM_COLOR = "always"
RUSTFLAGS = "-D warnings"
_.file = { path = ".env", optional = true }

[tasks.init]
description = "Rename the placeholder crate name to your project name (see scripts/init.py)"
run = "python3 scripts/init.py"

[tasks.lint]
description = "cargo fmt --check + clippy -D warnings + actionlint"
run = [
    "cargo fmt --all --check",
    "cargo clippy --all-targets --all-features --locked -- -D warnings",
    "actionlint",
]

[tasks.format]
description = "cargo fmt"
run = "cargo fmt --all"

[tasks.test]
description = "cargo test --all-targets --locked"
run = "cargo test --all-targets --locked"

[tasks.build]
description = "cargo build --all-targets --locked"
run = "cargo build --all-targets --locked"

[tasks.doc]
description = "cargo doc --no-deps --all-features (RUSTDOCFLAGS=-D warnings)"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --no-deps --all-features"

[tasks.ci]
description = "Full CI gate"
depends = ["lint", "test", "build", "doc"]

# Checks Cargo.lock against the RustSec advisory database and enforces
# deny.toml's source policy. Its own task rather than being inlined into
# `audit`, because the `cargo-deny` CI job runs exactly this and nothing
# else — so there is one definition of what the check is, not two that
# can drift. Needs network to fetch the advisory database, which is why
# it is not in `ci`.
[tasks.deny]
description = "cargo-deny: RustSec advisories + source policy against Cargo.lock"
run = "cargo-deny --all-features check advisories sources"

# Local mirror of the CI audit jobs, using the mise-pinned zizmor and
# cargo-deny. Not part of `ci` because both need network access: zizmor
# for its online audits, cargo-deny to fetch the advisory database.
#
# Without a token zizmor silently falls back to offline and skips the
# `impostor-commit` and `known-vulnerable-actions` audits, which is an
# unverified result, not a pass — so refuse to run rather than exit 0 on
# a weaker check than the name promises. The gate is at the top, so the
# task is all-or-nothing rather than partly-run.
[tasks.audit]
description = "zizmor audit of workflows + cargo-deny audit of Cargo.lock"
run = """
set -e
GH_TOKEN=$(gh auth token 2>/dev/null) || true
if [ -z "$GH_TOKEN" ]; then
  echo "No GitHub token: run \\`gh auth login\\`. Refusing to run a" >&2
  echo "partial audit — the online audits would be silently skipped." >&2
  exit 1
fi
export GH_TOKEN
zizmor --collect=all --strict-collection .
mise run deny
"""

[tasks.ci-watch]
description = "Watch GitHub Actions CI for the current branch; exits non-zero on failure"
run = """
sleep 5
remote_url=$(git remote get-url upstream 2>/dev/null || git remote get-url origin)
repo=$(echo "$remote_url" | sed -E 's|^.*github\\.com[:/]||; s|\\.git$||')
run_id=$(gh run list --repo "$repo" --branch "$(git branch --show-current)" --limit 1 --json databaseId --jq '.[0].databaseId')
if [ -z "$run_id" ]; then echo "No run found for current branch on $repo" >&2; exit 1; fi
gh run watch --repo "$repo" --exit-status "$run_id"
"""
